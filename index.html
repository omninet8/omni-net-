<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omni Net - Service de nettoyage</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      color: #222;
      scroll-behavior: smooth;
    }

    header {
      background: #3fa9f5;
      color: white;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header img {
      width: 100px;
      height: auto;
      margin-top: 1rem;
      animation: slideIn 1s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slogan {
      font-size: 1.3rem;
      margin-top: 0.5rem;
      font-style: italic;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .buttons {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .buttons a {
      display: inline-block;
      background-color: #ffffff;
      color: #3fa9f5;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .buttons a:hover {
      background-color: #eaf6ff;
    }

    section {
      padding: 2rem;
      max-width: 900px;
      margin: auto;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.3s;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .services h2, .contact h2 {
      text-align: center;
      color: #3fa9f5;
    }

    .service-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .service {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .service:hover {
      transform: translateY(-5px);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }

    input, textarea {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      background-color: #3fa9f5;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #3498db;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #eaf6ff;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Omni Net</h1>
    <div class="slogan">Votre propreté, notre priorité !</div>
    <div class="buttons">
      <a href="#contact">Demander une soumission</a>
      <a href="tel:5141234567">Appeler maintenant</a>
    </div>
    <img src="mascotte.png" alt="Mascotte d'Omni Net" />
  </header>

  <section class="services">
    <h2>Nos Services</h2>
    <div class="service-list">
      <div class="service">🧹 Ménage industriel</div>
      <div class="service">🏢 Ménage commercial</div>
      <div class="service">🏠 Ménage résidentiel</div>
      <div class="service">🪟 Lavage de vitres</div>
      <div class="service">🧼 Lavage de tapis</div>
    </div>
  </section>

  <section class="contact" id="contact">
    <h2>Contact</h2>
    <form>
      <input type="text" name="nom" placeholder="Votre nom" required />
      <input type="email" name="email" placeholder="Votre courriel" required />
      <textarea name="message" placeholder="Votre message" rows="5" required></textarea>
      <button type="submit">Envoyer</button>
    </form>
  </section>

  <footer>
    &copy; 2025 Omni Net – Tous droits réservés
  </footer>

</body>
</html>
