<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omni Net - Service de nettoyage</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      color: #222;
    }

    header {
      background: #3fa9f5;
      color: white;
      padding: 2rem;
      text-align: center;
    }

    header img {
      width: 100px;
      height: auto;
      margin-top: 1rem;
    }

    .slogan {
      font-size: 1.3rem;
      margin-top: 0.5rem;
      font-style: italic;
    }

    section {
      padding: 2rem;
      max-width: 900px;
      margin: auto;
    }

    .services h2 {
      text-align: center;
      color: #3fa9f5;
    }

    .service-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .service {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #eaf6ff;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Omni Net</h1>
    <div class="slogan">Votre propreté, notre priorité !</div>
    <img src="mascotte.png" alt="Mascotte d'Omni Net" />
  </header>

  <section class="services">
    <h2>Nos Services</h2>
    <div class="service-list">
      <div class="service">🧹 Ménage industriel</div>
      <div class="service">🏢 Ménage commercial</div>
      <div class="service">🏠 Ménage résidentiel</div>
      <div class="service">🪟 Lavage de vitres</div>
      <div class="service">🧼 Lavage de tapis</div>
    </div>
  </section>

  <footer>
    &copy; 2025 Omni Net – Tous droits réservés
  </footer>

</body>
</html>
